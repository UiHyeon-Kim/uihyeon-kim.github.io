<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>UiHyeon Kim — Apps</title>
  <meta name="description" content="UiHyeon Kim이 만드는 앱, PoseUp과 SNAPBOUND를 만나보세요.">
  <link rel="canonical" href="https://uihyeon-kim.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="UiHyeon Kim — Apps">
  <meta property="og:description" content="PoseUp과 SNAPBOUND의 소개와 안내를 한곳에서 확인하세요.">
  <meta property="og:url" content="https://uihyeon-kim.github.io/">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div class="wrap">
    <header class="site-header">
      <a class="site-name" href="/">UiHyeon Kim</a>
      <a class="github-link" href="https://github.com/UiHyeon-Kim">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main id="main">
      <p class="eyebrow">APPS</p>
      <h1>만든 앱을 만나보세요.</h1>
      <p class="intro">앱 소개와 이용에 필요한 안내를 모았습니다.</p>
      <div class="app-grid">
        <a class="app-card poseup" href="/poseup/" aria-labelledby="poseup-title" aria-describedby="poseup-description">
          <div class="card-top"><span class="app-category">FITNESS</span><span class="arrow" aria-hidden="true">↗</span></div>
          <img class="app-icon" src="/poseup/assets/poseup-icon.png" width="56" height="56" alt="">
          <h2 id="poseup-title">PoseUp</h2>
          <p id="poseup-description">카메라로 자세를 확인하며 쌓아가는<br>푸쉬업 습관과 나만의 운동 기록.</p>
          <span class="card-link">앱 소개 보기 <span aria-hidden="true">→</span></span>
        </a>
        <a class="app-card snapbound" href="/snapbound/" aria-labelledby="snapbound-title" aria-describedby="snapbound-description">
          <div class="card-top"><span class="app-category">GAME</span><span class="arrow" aria-hidden="true">↗</span></div>
          <span class="game-icon" aria-hidden="true">S</span>
          <h2 id="snapbound-title">SNAPBOUND</h2>
          <p id="snapbound-description">사진 한 장에서 시작하는 점프 게임.<br>내 사진으로 만드는 작은 모험.</p>
          <span class="card-link">앱 소개·테스트 안내 <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </main>
    <footer>© 2026 UiHyeon Kim</footer>
  </div>
</body>
</html>
